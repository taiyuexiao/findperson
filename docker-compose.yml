version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: swzr-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: shouwenzeren
      POSTGRES_USER: swzr_admin
      POSTGRES_PASSWORD: swzr_dev_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swzr_admin -d shouwenzeren"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
